<!--
  ?v=... belt-and-suspenders cache-busting for the two entry resources
  (this file's own stylesheet/script tags) on every release. The primary
  fix for stale CSS/JS after an upgrade is MainWindow.xaml.cs explicitly
  clearing WebView2's HTTP disk cache on every launch (Profile.
  ClearBrowsingDataAsync) — that also covers the ES modules these entry
  files import, which a query string on just these two tags can't reach.
  Bump this string (matches MainWindow.xaml.cs's AppVersion) with every
  release anyway, since it's cheap and doesn't hurt.
-->
<link rel="stylesheet" href="css/styles.css?v=2.9.0">
</head>

<div id="app"></div>
<script type="module" src="js/app.js?v=2.9.0"></script>
